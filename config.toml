# Every number and setting in the repo. Read with tomllib.

[git]
main_branch = "main"

[aws]
region = "us-east-1"
project_tag = "project=voxelis-kiroween"
read_profile = "kiroween-read"
runner_profile = "kiroween-runner"
spend_variable = "APPROVED_SPEND"
# Name of the CloudFormation stack made from cloud/aws-setup.yaml. Our code finds its resources through its outputs.
stack_name = "voxelis-kiroween"

[paid]
# Raw aws commands that start paid things, as "service operation".
aws = [
  "ec2 run-instances", "ec2 start-instances", "ec2 create-image",
  "ec2 request-spot-instances", "ec2 request-spot-fleet", "ec2 create-fleet",
  "cloudformation create-stack", "cloudformation update-stack", "cloudformation deploy",
  "cloudformation execute-change-set",
]

[devlog]
path = "docs/devlog.md"
commit_message = "Devlog: {task}"

[jobs]
# Folder that holds every job folder. A relative path is read from the repo root.
jobs_folder = "data/jobs"
# Preset a job gets when none is chosen: "fast", "default" or "quality".
default_preset = "fast"
# Largest video accepted, in bytes (4 GB).
max_video_bytes = 4294967296
# Longest video accepted, in seconds (10 minutes).
max_video_seconds = 600
# Shortest part of the video a job may use, in seconds.
min_used_seconds = 3
# Longest time ffprobe may take to read a video, in seconds.
ffprobe_timeout_seconds = 30

[fake]
# The test step. Only tests change this: "none", "expected" or "unexpected".
fail = "none"
# Size of each small file the fake step writes, in bytes.
file_bytes = 16

[fake.fast]
# Number of small files the fake step writes.
files = 1

[fake.default]
# Number of small files the fake step writes.
files = 2

[fake.quality]
# Number of small files the fake step writes.
files = 3

[cloud]
# How many minutes before the Time_Cap a Step should stop and save, for the Cap_Deadline.
upload_margin_minutes = 10
# How often the status command and the machine's uploader poll, in seconds.
poll_seconds = 20
# Price of one in-use public IPv4 address, in US dollars per hour.
ipv4_usd_per_hour = 0.005
# Price of gp3 root storage, in US dollars per GB per month.
gp3_usd_per_gb_month = 0.08
# Root volume size in GB for every machine (jobs, smoke test and image builder).
root_gb = 150
# The instance type the smoke test runs on.
smoke_instance_type = "g5.xlarge"
# The instance type the image build runs on.
image_builder_type = "g5.4xlarge"
# The public SSM parameter that holds the current Base_AMI id.
base_ami_parameter = "/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id"

# One Machine_Spec per Allowed_Type. The type name holds a dot, so its table header is quoted,
# or TOML would read [cloud.types.g5.xlarge] as nested tables. memory_gb and gpu_memory_gb are the
# hard needs a Step's section is checked against; vcpus is the soft need and the G-quota cost.
# Prices are us-east-1 Linux On-Demand, published 2026-11-21.
[cloud.types."g5.xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 4
# RAM in GB, a hard need.
memory_gb = 16
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.006
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 32
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.212
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.624
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.8xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 32
# RAM in GB, a hard need.
memory_gb = 128
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 2.448
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 32
# GPU memory in GB (NVIDIA L4), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 0.9776
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA L4), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.3232
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6e.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA L40S), a hard need.
gpu_memory_gb = 48
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 2.24208
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6e.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 128
# GPU memory in GB (NVIDIA L40S), a hard need.
gpu_memory_gb = 48
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 3.00424
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.presets.fast]
# Ordered fallback. Primary g5.8xlarge is pinned; the rest are tunable.
fallback = ["g5.8xlarge", "g5.4xlarge", "g6.4xlarge", "g5.2xlarge", "g6.2xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 30
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 120
[cloud.presets.default]
# Ordered fallback. Primary g5.8xlarge is pinned; the rest are tunable.
fallback = ["g5.8xlarge", "g5.4xlarge", "g6.4xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 60
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 180
[cloud.presets.quality]
# Primary g6e.4xlarge and fallback g6e.2xlarge are pinned (assumption D), the 48 GB L40S class.
fallback = ["g6e.4xlarge", "g6e.2xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 120
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 360

# Expected/cap for the smoke test and the image build (settled in Q2).
[cloud.smoke]
# Expected run time in minutes, for the money quote.
expected_minutes = 10
# The Time_Cap in minutes.
cap_minutes = 30
[cloud.image]
# Expected run time in minutes, for the money quote.
expected_minutes = 45
# The Time_Cap in minutes.
cap_minutes = 120
[frames]
# Width of the small grey frames the step scores, in pixels.
score_width = 320
# Nominal peak brightness, in nits, that zscale maps an HDR video from. Only HDR videos use it.
tonemap_npl = 100
# How much tonemap desaturates the bright highlights of an HDR video. 0 turns it off.
tonemap_desat = 0.0
# Mean motion over the window below which a frame counts as still, from 0 to 255.
still_motion = 1.0
# Length of the window for the still test, in seconds.
motion_window_seconds = 1
# Shortest still start or still end that gets cut off, in seconds.
min_still_seconds = 2
# Moving parts shorter than this count as still, in seconds.
blip_seconds = 0.5
# A frame is jolted when its sharpness is below this share of the window's median.
jolt_ratio = 0.6
# Length of the window for the jolt test, in seconds.
jolt_window_seconds = 1
# Most frames used to find the pixels stuck to the camera.
mask_samples = 240
# A pixel is stuck when its change is below this share of the median change.
mask_ratio = 0.2
# Smallest share of the frame the stuck pixels must cover for the mask to be used.
mask_min_coverage = 0.002
# Largest share of the frame the stuck pixels may cover for the mask to be used.
mask_max_coverage = 0.25
# JPEG quality of the picks and their grey copies, from 1 to 100.
jpeg_quality = 95
# Longest edge of the picks, in pixels. A smaller video isn't scaled up.
long_edge = 1600
# Seconds of kept video per pick, when that gives more than the preset's base_picks.
seconds_per_pick = 2
# Most picks a job gets.
max_picks = 400
# Fewest picks a job can go on with.
min_picks = 30
# Fewest vCPUs the job's cloud machine needs for this step. The step never checks it.
min_vcpus = 16
# Least memory the job's cloud machine needs for this step, in GB. The step never checks it.
min_memory_gb = 16
# Longest time each of the two ffmpeg reads of the video may take, in seconds.
ffmpeg_timeout_seconds = 1800
# Longest time ffprobe, or ffmpeg listing its filters, may take, in seconds.
ffprobe_timeout_seconds = 30

[frames.fast]
# Fewest picks the step aims for.
base_picks = 120

[frames.default]
# Fewest picks the step aims for.
base_picks = 150

[frames.quality]
# Fewest picks the step aims for.
base_picks = 200

[clean]
# File in out/ that the training step writes and the clean step reads.
train_ply = "train.ply"
# File in out/ that the clean step writes: the clean splat, a binary PLY. Must end in .ply.
clean_ply = "clean.ply"
# File in out/ that the clean step writes: the small copy for the web viewer. Must end in .sog.
clean_sog = "clean.sog"
# Real opacity, 0 to 1, below which a Gaussian is faint and judged with the rest of its cube.
min_opacity = 0.005
# Cube side for the faint filter: the trimmed box's longest side divided by this, a whole number above 0.
faint_cube_divisions = 128
# Fewest faint Gaussians a cube must hold to keep them.
faint_min_per_cube = 8
# A cube keeps its faint Gaussians only if they paint more than this share of the cube, 0 up to 1.
faint_min_paint_share = 0.10
# Percent of the centres trimmed from each end of each axis for the trimmed box, 0 up to 50.
extent_trim_percent = 1
# Number of nearest other Gaussians the isolated filter looks at.
neighbours = 8
# Drop a Gaussian whose mean neighbour distance is over this many times its neighbours' median.
isolation_ratio = 8.0
# Largest share of the Gaussians the faint and isolated filters may drop before the step stops.
max_removed_fraction = 0.70
# Fewest Gaussians the clean splat may hold. Fewer fails the step.
min_kept_splats = 10000
# Warn when the clean splat keeps less than this share of the trained splat's Gaussians.
warn_kept_fraction = 0.5
# Most Gaussians the step takes in. Their data is a quarter of the job machine's 8 GB.
max_source_splats = 8000000
# Worker threads for the neighbour search and splat-transform, 0 to 8. 0 runs splat-transform inline.
max_workers = 4
# Longest time splat-transform may take to write the viewer copy, in seconds.
splat_transform_timeout_seconds = 3600

[clean.fast]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3.
sog_sh_bands = 3
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 10

[clean.default]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3.
sog_sh_bands = 3
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 10

[clean.quality]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3.
sog_sh_bands = 3
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 20
