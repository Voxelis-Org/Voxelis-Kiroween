# Every number and setting in the repo. Read with tomllib.

[git]
main_branch = "main"

[aws]
region = "us-east-1"
project_tag = "project=voxelis-kiroween"
read_profile = "kiroween-read"
runner_profile = "kiroween-runner"
spend_variable = "APPROVED_SPEND"
# Name of the CloudFormation stack made from cloud/aws-setup.yaml. Our code finds its resources through its outputs.
stack_name = "voxelis-kiroween"

[paid]
# Raw aws commands that start paid things, as "service operation".
aws = [
  "ec2 run-instances", "ec2 start-instances", "ec2 create-image",
  "ec2 request-spot-instances", "ec2 request-spot-fleet", "ec2 create-fleet",
  "cloudformation create-stack", "cloudformation update-stack", "cloudformation deploy",
  "cloudformation execute-change-set",
]

[devlog]
path = "docs/devlog.md"
commit_message = "Devlog: {task}"

[jobs]
# Folder that holds every job folder. A relative path is read from the repo root.
jobs_folder = "data/jobs"
# Preset a job gets when none is chosen: "fast", "default" or "quality".
default_preset = "fast"
# Largest video accepted, in bytes (4 GB).
max_video_bytes = 4294967296
# Longest video accepted, in seconds (10 minutes).
max_video_seconds = 600
# Shortest part of the video a job may use, in seconds.
min_used_seconds = 3
# Longest time ffprobe may take to read a video, in seconds.
ffprobe_timeout_seconds = 30

[fake]
# The test step. Only tests change this: "none", "expected" or "unexpected".
fail = "none"
# Size of each small file the fake step writes, in bytes.
file_bytes = 16

[fake.fast]
# Number of small files the fake step writes.
files = 1

[fake.default]
# Number of small files the fake step writes.
files = 2

[fake.quality]
# Number of small files the fake step writes.
files = 3

[cloud]
# How many minutes before the Time_Cap a Step should stop and save, for the Cap_Deadline.
upload_margin_minutes = 10
# How often the status command and the machine's uploader poll, in seconds.
poll_seconds = 20
# Price of one in-use public IPv4 address, in US dollars per hour.
ipv4_usd_per_hour = 0.005
# Price of gp3 root storage, in US dollars per GB per month.
gp3_usd_per_gb_month = 0.08
# Root volume size in GB for every machine (jobs, smoke test and image builder).
root_gb = 150
# The instance type the smoke test runs on.
smoke_instance_type = "g5.xlarge"
# The instance type the image build runs on.
image_builder_type = "g5.4xlarge"
# The public SSM parameter that holds the current Base_AMI id.
base_ami_parameter = "/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id"

# One Machine_Spec per Allowed_Type. The type name holds a dot, so its table header is quoted,
# or TOML would read [cloud.types.g5.xlarge] as nested tables. memory_gb and gpu_memory_gb are the
# hard needs a Step's section is checked against; vcpus is the soft need and the G-quota cost.
# Prices are us-east-1 Linux On-Demand, published 2026-11-21.
[cloud.types."g5.xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 4
# RAM in GB, a hard need.
memory_gb = 16
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.006
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 32
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.212
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.624
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g5.8xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 32
# RAM in GB, a hard need.
memory_gb = 128
# GPU memory in GB (NVIDIA A10G), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 2.448
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 32
# GPU memory in GB (NVIDIA L4), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 0.9776
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA L4), a hard need.
gpu_memory_gb = 24
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 1.3232
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6e.2xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 8
# RAM in GB, a hard need.
memory_gb = 64
# GPU memory in GB (NVIDIA L40S), a hard need.
gpu_memory_gb = 48
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 2.24208
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.types."g6e.4xlarge"]
# vCPUs, the cost against the G quota.
vcpus = 16
# RAM in GB, a hard need.
memory_gb = 128
# GPU memory in GB (NVIDIA L40S), a hard need.
gpu_memory_gb = 48
# us-east-1 On-Demand price per hour, in US dollars, on price_date.
price_per_hour_usd = 3.00424
# The date price_per_hour_usd was read.
price_date = "2026-11-21"

[cloud.presets.fast]
# Ordered fallback. Primary g5.8xlarge is pinned; the rest are tunable.
fallback = ["g5.8xlarge", "g5.4xlarge", "g6.4xlarge", "g5.2xlarge", "g6.2xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 30
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 120
[cloud.presets.default]
# Ordered fallback. Primary g5.8xlarge is pinned; the rest are tunable.
fallback = ["g5.8xlarge", "g5.4xlarge", "g6.4xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 60
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 180
[cloud.presets.quality]
# Primary g6e.4xlarge and fallback g6e.2xlarge are pinned (assumption D), the 48 GB L40S class.
fallback = ["g6e.4xlarge", "g6e.2xlarge"]
# Expected run time in minutes, for the money quote.
expected_minutes = 120
# The Time_Cap in minutes, the hard backstop when something hangs.
cap_minutes = 360

# Expected/cap for the smoke test and the image build (settled in Q2).
[cloud.smoke]
# Expected run time in minutes, for the money quote.
expected_minutes = 10
# The Time_Cap in minutes.
cap_minutes = 30
# Longest time each of the smoke machine's command checks (ffmpeg, COLMAP, Node, splat-transform) may take, in seconds.
check_timeout_seconds = 60
# Gaussians in the tiny synthetic scene the smoke machine renders with gsplat.
scene_gaussians = 256
# Width and height in pixels of the smoke machine's render, its SSIM images and its test video.
image_pixels = 64
# Length of the test video the smoke machine makes its fake-step job from, in seconds. At least [jobs].min_used_seconds.
video_seconds = 4
# Images in the smoke machine's tiny training scene, each image_pixels square.
train_images = 4
# Points the smoke machine's training scene starts from.
train_points = 200
# Most splats the smoke machine's training may grow to, its splat budget.
train_splats = 400
# Iterations the smoke machine trains for.
train_steps = 30
# Iteration after which the smoke training's MCMC starts refining.
train_refine_start_step = 10
# Iterations between the smoke training's refines.
train_refine_every = 10
# Iterations between each rise of the smoke training's spherical harmonics degree.
train_sh_degree_interval = 5
[cloud.image]
# Expected run time in minutes, for the money quote.
expected_minutes = 75
# The Time_Cap in minutes.
cap_minutes = 120
[frames]
# Width of the small grey frames the step scores, in pixels.
score_width = 320
# Nominal peak brightness, in nits, that zscale maps an HDR video from. Only HDR videos use it.
tonemap_npl = 100
# How much tonemap desaturates the bright highlights of an HDR video. 0 turns it off.
tonemap_desat = 0.0
# Mean motion over the window below which a frame counts as still, from 0 to 255.
still_motion = 1.0
# Length of the window for the still test, in seconds.
motion_window_seconds = 1
# Shortest still start or still end that gets cut off, in seconds.
min_still_seconds = 2
# Moving parts shorter than this count as still, in seconds.
blip_seconds = 0.5
# A frame is jolted when its sharpness is below this share of the window's median.
jolt_ratio = 0.6
# Length of the window for the jolt test, in seconds.
jolt_window_seconds = 1
# Most frames used to find the pixels stuck to the camera.
mask_samples = 240
# A pixel is stuck when its change is below this share of the median change.
mask_ratio = 0.2
# Smallest share of the frame the stuck pixels must cover for the mask to be used.
mask_min_coverage = 0.002
# Largest share of the frame the stuck pixels may cover for the mask to be used.
mask_max_coverage = 0.25
# JPEG quality of the picks and their grey copies, from 1 to 100.
jpeg_quality = 95
# Longest edge of the picks, in pixels. A smaller video isn't scaled up.
long_edge = 1600
# Seconds of kept video per pick, when that gives more than the preset's base_picks.
seconds_per_pick = 2
# Most picks a job gets.
max_picks = 400
# Fewest picks a job can go on with.
min_picks = 30
# Fewest vCPUs the job's cloud machine needs for this step. The step never checks it.
min_vcpus = 16
# Least memory the job's cloud machine needs for this step, in GB. The step never checks it.
min_memory_gb = 16
# Longest time each of the two ffmpeg reads of the video may take, in seconds.
ffmpeg_timeout_seconds = 1800
# Longest time ffprobe, or ffmpeg listing its filters, may take, in seconds.
ffprobe_timeout_seconds = 30

[frames.fast]
# Fewest picks the step aims for.
base_picks = 120

[frames.default]
# Fewest picks the step aims for.
base_picks = 150

[frames.quality]
# Fewest picks the step aims for.
base_picks = 200

[train]
# Longest edge of the images the step trains at, in pixels. A smaller camera isn't scaled up.
long_edge = 1600
# A training pixel whose mask value, from 0 to 255, is below this is left out of the loss.
mask_threshold = 128
# Seed for the random subset of points, the image order and torch's random numbers.
seed = 42
# Iterations between each rise of the spherical harmonics degree, which stops at 3.
sh_degree_interval = 1000
# The scene's size is this times the cameras' largest distance from their mean position.
scene_extent_factor = 1.1
# The renderer leaves out splats nearer a camera than this times the points' median depth.
near_plane_factor = 0.03
# Opacity every splat starts at, above 0 and below 1.
start_opacity = 0.5
# A splat's starting size is this times the RMS distance to its nearest other points.
start_scale_factor = 0.1
# How many nearest other points set a splat's starting size.
start_scale_neighbours = 3
# Most point pairs one chunk of the nearest-point search holds on the GPU (about 400 MB).
neighbour_chunk_pairs = 100000000
# Starting learning rate of the splats' positions, times the scene's size.
means_lr = 0.00016
# Share of its start the positions' learning rate has fallen to after the last iteration.
means_lr_final = 0.01
# Learning rate of the splats' log scales.
scales_lr = 0.005
# Learning rate of the splats' rotations.
quats_lr = 0.001
# Learning rate of the splats' opacity logits.
opacities_lr = 0.05
# Learning rate of the splats' band-0 colours.
sh_dc_lr = 0.0025
# Learning rate of the splats' higher spherical harmonics.
sh_rest_lr = 0.000125
# Adam's epsilon, for every optimiser.
adam_eps = 1e-15
# Learning rate of each image's exposure fix.
exposure_lr = 0.001
# Weight of the L1 colour loss. 0 turns it off.
l1_weight = 0.8
# Weight of the SSIM loss. 0 turns it off.
ssim_weight = 0.2
# Weight of the splats' mean opacity, which fades splats the images don't need. 0 turns it off.
opacity_reg = 0.01
# Weight of the splats' mean scale, which keeps them small. 0 turns it off.
scale_reg = 0.01
# Weight of the effective-rank term against needle-shaped splats. 0 turns it off.
erank_reg = 0.01
# Small number inside the effective-rank term's log, so the term stays finite.
erank_epsilon = 1e-5
# Share of the iterations after which the effective-rank term is on: the float nearest 7/30.
erank_start_fraction = 0.23333333333333334
# Iteration after which MCMC starts moving and adding splats.
refine_start_step = 500
# Iterations between MCMC's refines.
refine_every = 100
# Iteration at which MCMC stops refining, at the latest.
refine_stop_step = 25000
# MCMC also stops refining at this share of the iterations, when that comes first.
refine_stop_fraction = 0.9
# Minutes before the job's cap deadline that the splat must be written and checked, for the clean step.
clean_reserve_minutes = 10
# Minutes before that time that the last iteration may start, to save and check the splat.
save_margin_minutes = 5
# Share of the preset's GPU memory the GPU must report, since a "24 GB" card reports a little less.
gpu_memory_slack = 0.9
# Fewest vCPUs the job's cloud machine needs for this step. The step never checks it.
min_vcpus = 4
# Least memory the job's cloud machine needs for this step, in GB. The step never checks it.
min_memory_gb = 32

[train.fast]
# Iterations the step trains for.
steps = 7000
# Most splats the step trains, MCMC's cap.
max_splats = 1000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 24

[train.default]
# Iterations the step trains for.
steps = 15000
# Most splats the step trains, MCMC's cap.
max_splats = 2000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 24

[train.quality]
# Iterations the step trains for.
steps = 30000
# Most splats the step trains, MCMC's cap.
max_splats = 3000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 48
