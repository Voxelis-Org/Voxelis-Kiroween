# Lowest weight of the depth loss on a plain pixel.
depth_weight_floor = 0.1
# Largest relative inverse depth error one pixel adds to the depth loss.
depth_error_cap = 1.0
# Weight of the loss between the splats' rendered normals and the priors' normals. 0 turns it off.
normal_weight = 0.05
# Iteration at which that normal loss starts.
normal_start_step = 3000
# From normal_start_step, that normal loss runs on every this many iterations.
normal_every = 4
# Weight of the splats' mean smallest scale in units of the scene extent, with depth priors only. 0 turns it off.
flatten_reg = 1.0
# Weight of the loss between the rendered depth's normals and the priors' normals. 0 turns it off.
depth_normal_weight = 0.05
# Weight of the loss between the splats' rendered normals and the rendered depth's normals. 0 turns it off.
normal_consistency_weight = 0.015
# Share of the iterations after which the two rendered-depth normal losses are on: the float nearest 7/30.
depth_normal_start_fraction = 0.23333333333333334
# Share of the preset's splat budget that may start from the depth priors: the float nearest 1/3.
backproject_share = 0.3333333333333333
# Most splats that may start from the depth priors. 0 turns that off.
backproject_max = 500000
# Fewest vCPUs the job's cloud machine needs for this step. The step never checks it.
min_vcpus = 4
# Least memory the job's cloud machine needs for this step, in GB. The step never checks it.
min_memory_gb = 32

[train.fast]
# Iterations the step trains for.
steps = 7000
# Most splats the step trains, MCMC's cap.
max_splats = 1000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 24

[train.default]
# Iterations the step trains for.
steps = 15000
# Most splats the step trains, MCMC's cap.
max_splats = 2000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 24

[train.quality]
# Iterations the step trains for.
steps = 30000
# Most splats the step trains, MCMC's cap.
max_splats = 3000000
# Least GPU memory the job's machine needs for this step, in GB. The step checks it.
min_gpu_memory_gb = 48

[clean]
# File in out/ that the training step writes and the clean step reads.
train_ply = "train.ply"
# File in out/ that the clean step writes: the clean splat, a binary PLY. Must end in .ply.
clean_ply = "clean.ply"
# File in out/ that the clean step writes: the small copy for the web viewer. Must end in .sog.
clean_sog = "clean.sog"
# Fewest training frames that must see a Gaussian's centre, in front of the camera and inside the frame, to keep it.
min_seen_frames = 2
# Real opacity, 0 to 1, below which a Gaussian is faint and judged with the rest of its cube. 0 turns the faint filter off: at 0.005 it removed a faint white wall in a real job.
min_opacity = 0.0
# Cube side for the faint filter: the trimmed box's longest side divided by this, a whole number above 0.
faint_cube_divisions = 128
# Fewest faint Gaussians a cube must hold to keep them.
faint_min_per_cube = 8
# A cube keeps its faint Gaussians only if they paint more than this share of the cube, 0 up to 1.
faint_min_paint_share = 0.10
# Percent of the centres trimmed from each end of each axis for the trimmed box, 0 up to 50.
extent_trim_percent = 1
# Number of nearest other Gaussians the isolated filter looks at.
neighbours = 8
# Drop a Gaussian whose mean neighbour distance is over this many times its neighbours' median.
isolation_ratio = 8.0
# Largest share of the Gaussians the faint and isolated filters may drop before the step stops.
max_removed_fraction = 0.70
# Fewest Gaussians the clean splat may hold. Fewer fails the step.
min_kept_splats = 10000
# Warn when the clean splat keeps less than this share of the trained splat's Gaussians.
warn_kept_fraction = 0.5
# Most Gaussians the step takes in. Their data is a quarter of the job machine's 8 GB.
max_source_splats = 8000000
# Worker threads for the neighbour search and splat-transform, 0 to 8. 0 runs splat-transform inline.
max_workers = 4
# Longest time splat-transform may take to write the viewer copy, in seconds.
splat_transform_timeout_seconds = 3600

[clean.fast]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3. 0 skips splat-transform's CPU SH compression, which ran past an hour on a 912K-splat job.
sog_sh_bands = 0
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 10

[clean.default]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3. 0 skips splat-transform's CPU SH compression, which ran past an hour on a 912K-splat job.
sog_sh_bands = 0
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 10

[clean.quality]
# Bands of higher spherical harmonics kept in the viewer copy, 0 to 3. 0 skips splat-transform's CPU SH compression, which ran past an hour on a 912K-splat job.
sog_sh_bands = 0
# Iterations of splat-transform's spherical harmonic compression.
sh_iterations = 20

[website]
# When the website stops starting jobs, in UTC, as text like "2027-02-04T08:00:00Z".
stop_starting_at = "2027-02-04T08:00:00Z"
# Most website jobs that may start in one UTC day.
daily_jobs = 10
# Most money that website jobs may reserve in one UTC day, in US dollars.
daily_cost_usd = 52
# Most money that website jobs may reserve in total, across every redeploy, in US dollars.
total_cost_usd = 500
# Minutes added to a preset's time cap for the worst-case reservation: a hung machine runs its boot minutes before the cap's shutdown is scheduled.
boot_margin_minutes = 5
# Size of each part the browser uploads, in bytes (16 MiB). S3 takes 5 MiB up to 5 GiB per part.
upload_part_bytes = 16777216
# How long an upload link stays valid, in seconds (15 minutes).
upload_link_seconds = 900
# How many times the browser asks for a new link for one part before it gives up.
part_link_retries = 3
# How long a download link stays valid, in seconds (5 minutes). The viewer's links last as long.
download_link_seconds = 300
# Size of each part when the website copies a video inside S3, in bytes (64 MiB).
copy_part_bytes = 67108864
# How long the table keeps an upload's record, in hours. S3 deletes the video itself after 1 day.
upload_record_hours = 48
# Most top-level boxes the video check walks before it finds the moov box.
max_boxes = 100
# Largest moov box the video check reads, in bytes (32 MiB).
max_moov_bytes = 33554432
# Minutes since a job started before a job with no summary can be shown as ended without a result, once its machines are gone.
ended_check_minutes = 10
# Failed sign-ins from one address that start a wait.
signin_max_failures = 5
# The window those failed sign-ins must fall within, in minutes.
signin_window_minutes = 15
# How long an address waits after too many failed sign-ins, in minutes.
signin_wait_minutes = 15
# How long the sign-in page's form token stays valid, in minutes.
signin_token_minutes = 60
# How long a sign-in lasts, in days.
session_days = 7
# Random bytes in each session id, CSRF token, sign-in form token and share link.
token_bytes = 32
# Length of the passwords the account command makes, in letters and digits.
password_length = 24
# scrypt's cost N, a power of 2. With r = 8 it uses N kibibytes of memory per hash.
scrypt_n = 32768
# scrypt's block size r.
scrypt_r = 8
# scrypt's parallelism p.
scrypt_p = 3
# Length of each password hash, in bytes.
scrypt_dklen = 32
# Length of each password's random salt, in bytes.
scrypt_salt_bytes = 16
# Largest request body the website reads, in bytes. The video never passes through the website.
max_body_bytes = 65536
# Most jobs the job list shows.
max_listed_jobs = 20
# Longest showcase title, in characters.
max_title_chars = 80
# Longest footage credit on a showcase entry, in characters.
max_credit_chars = 200
# Longest original file name kept with a job, in characters.
max_name_chars = 120
# How long a browser may keep the viewer's files, in seconds (1 hour). The engine alone is 2.9 MB.
static_cache_seconds = 3600
# The CloudShell commands' modules. The guard hook blocks running one of these on a laptop.
cloudshell_modules = ["app.deploy", "app.account_command", "app.showcase_command"]
# Folder under /tmp in CloudShell that the deploy command clones, builds and caches in.
deploy_folder = "/tmp/voxelis-website"
# Largest unzipped website bundle, in bytes: Lambda's limit of 250 MB.
max_bundle_bytes = 262144000
