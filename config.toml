# Every number and setting in the repo. Read with tomllib.

[git]
main_branch = "main"

[aws]
region = "us-east-1"
project_tag = "project=voxelis-kiroween"
read_profile = "kiroween-read"
runner_profile = "kiroween-runner"
spend_variable = "APPROVED_SPEND"

[paid]
# Raw aws commands that start paid things, as "service operation".
aws = [
  "ec2 run-instances", "ec2 start-instances", "ec2 create-image",
  "ec2 request-spot-instances", "ec2 request-spot-fleet", "ec2 create-fleet",
  "cloudformation create-stack", "cloudformation update-stack", "cloudformation deploy",
  "cloudformation execute-change-set",
]

[devlog]
path = "docs/devlog.md"
commit_message = "Devlog: {task}"
